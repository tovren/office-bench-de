name = "deepseek-v4-flash-high"
label = "DeepSeek V4 Flash 0731, thinking high"
base_url = "https://ai-gateway.vercel.sh/v1"
model = "deepseek/deepseek-v4-flash-0731"
api_key_env = "AI_GATEWAY_API_KEY"

[params]
max_tokens = 32000
reasoning = { effort = "high" }
temperature = 1.0
top_p = 0.95
providerOptions = { gateway = { order = ["runware"] } }  # preferred provider; falls back when at capacity

[info]
open_weights = true
parameters = "284B-A13B"
weights_gb = 167
