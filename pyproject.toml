[project]
name = "office-bench-de"
version = "0.3.1"
description = "Benchmark: how well do LLMs create German Word, Excel and PowerPoint files through tool calls?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tovren" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "python-pptx>=1.0.2,<2",
    "lxml>=5",
    "httpx>=0.27,<1",
]

[project.scripts]
obench = "officebench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/officebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs LibreOffice or takes several seconds"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/officebench/tool/office_documents.py"]  # vendored unchanged

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
