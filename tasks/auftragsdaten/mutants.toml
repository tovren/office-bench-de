# Broken variants of reference.json (format: docs/mutants.md).
# Sheet 1: 80 orders (rows 2–81), total row; sheet 2 „Je Monat“ with SUMIF/COUNTIF over the date and a column chart;
# sheet 3 „Je Kunde“ with SUMIF/COUNTIF, descending by revenue.

# observed in an earlier run (sums typed in as constants). A fixed sum below the list cannot be appended with the
# operations; this variant has no total row at all.
[[mutant]]
name = "no_total_row"
defect = "no SUM total row below the orders"
remove = ["sheets.0.columns.4.total"]
expected = ["total_row"]

# The prompt says explicitly „die offenen zählen mit“; the twelve open orders (18,031.08 €) are missing.
[[mutant]]
name = "open_orders_dropped"
defect = "the twelve open orders left out together with the cancellations (68 instead of 80 rows, total 59,776.72 €)"
remove = [
  "sheets.0.rows.79", "sheets.0.rows.78", "sheets.0.rows.77", "sheets.0.rows.76", "sheets.0.rows.75",
  "sheets.0.rows.73", "sheets.0.rows.72", "sheets.0.rows.70", "sheets.0.rows.68", "sheets.0.rows.66",
  "sheets.0.rows.65", "sheets.0.rows.64",
]
expected = ["values_present", "data_rows_min", "chart_values"]

# observed in an earlier run (months 18,693.66 / 14,697.84 / 15,193.27 €, chart with wrong values). Here SUMIF only
# counts the date rows up to row 61, the rest of September is missing.
[[mutant]]
name = "month_range_too_short"
defect = "SUMIF/COUNTIF of the monthly overview only over rows 2–61: September and total too small, chart wrong"
replace = [["$B$2:$B$81", "$B$2:$B$61"]]
expected = ["values_present", "chart_values"]

# observed in earlier runs (=COUNTA(B2:B9) under „Aufträge“: 8 instead of 80 orders)
[[mutant]]
name = "customer_sheet_count_instead_of_sum"
defect = "total row of the customer sheet counts the customers (8) under „Aufträge“ instead of summing the orders (80)"
set = [["sheets.2.columns.1.total", "count"]]
expected = ["sum_range"]
severity = "soft"

# observed in an earlier run (date column without date format, probably text; overviews as fixed values). The
# monthly overview holds fixed values here as there, so that only the date is wrong.
[[mutant]]
name = "date_as_text"
defect = "order date as text „2026-07-01“ instead of a date"
set = [
  ["sheets.0.columns.1.type", "text"],
  ["sheets.1.columns.3.formula", ""],
  ["sheets.1.columns.4.formula", ""],
  ["sheets.1.rows.0.3", 32], ["sheets.1.rows.0.4", 28106.88],
  ["sheets.1.rows.1.3", 24], ["sheets.1.rows.1.4", 19874.16],
  ["sheets.1.rows.2.3", 24], ["sheets.1.rows.2.4", 29826.76],
]
expected = ["date_as_text", "dates_between", "number_as_text", "column_format"]
severity = "soft"

# observed in an earlier run (three detail sheets, one per month; a chart of the three monthly values is missing)
[[mutant]]
name = "no_month_chart"
defect = "no column chart of the monthly revenue"
remove = ["sheets.1.chart"]
expected = ["chart"]

# The checklist asks for „absteigend nach Umsatz“ (Schulze & Partner before Kröger); `sorted` with `sheet` checks it.
[[mutant]]
name = "customers_alphabetical"
defect = "customer overview sorted alphabetically instead of descending by revenue"
set = [
  ["sheets.2.rows.0.0", "Autohaus Rempp GmbH"],
  ["sheets.2.rows.1.0", "Bäckerei Hölzle GmbH"],
  ["sheets.2.rows.2.0", "Hausverwaltung Kröger GmbH"],
  ["sheets.2.rows.3.0", "Hotel Traube"],
  ["sheets.2.rows.4.0", "Immobilien Sattler KG"],
  ["sheets.2.rows.5.0", "Pflegeheim Am Kirchberg gGmbH"],
  ["sheets.2.rows.6.0", "Schulze & Partner Steuerberater"],
  ["sheets.2.rows.7.0", "Wohnbau Neckartal eG"],
]
expected = ["sorted"]
