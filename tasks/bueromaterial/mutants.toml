# Broken variants of reference.json (format: docs/mutants.md). Follow-up task: the variant changes the second file,
# which is compared with the unchanged first one (previous).
# Correct: paper 4.49 € (179.60 €), toner removed, total 724.20 €, cost centre 4100 = 311.00 €, 4200 = 413.20 €.

# Typical follow-up error: the new price is not applied.
[[mutant]]
name = "old_paper_price"
defect = "copy paper still at 3.99 € instead of 4.49 € (total 704.20 instead of 724.20 €)"
number = [[4.49, 3.99]]
expected = ["values_present"]

# The toner stays in the list at 4 × 89 € (the task names this case in its comment).
[[mutant]]
name = "toner_kept"
defect = "toner not removed: total 1,080.20 instead of 724.20 €, cost centre 4200 769.20 instead of 413.20 €"
set = [["sheets.0.rows", [
  ["Kopierpapier A4, 500 Blatt", 40, 4.49, "", 4100],
  ["Ordner breit", 60, 2.49, "", 4200],
  ["Kugelschreiber blau, 10er-Pack", 12, 6.9, "", 4200],
  ["Haftnotizen gelb, 12 Blöcke", 10, 8.5, "", 4200],
  ["Toner HP 59A", 4, 89.0, "", 4200],
  ["Briefumschläge DIN lang, 500 Stück", 6, 21.9, "", 4100],
  ["Textmarker, 4er-Set", 15, 4.8, "", 4200],
  ["Heftklammern 24/6, 1.000 Stück", 20, 1.2, "", 4200],
]], ["sheets.1.columns.1.formula", "=SUMIF('Bestellung'!$E$2:$E$9,A{row},'Bestellung'!$D$2:$D$9)"]]
expected = ["values_present"]

[[mutant]]
name = "envelopes_wrong_cost_centre"
defect = "envelopes booked to cost centre 4200 instead of 4100 (4100 = 179.60 €, 4200 = 544.60 €)"
set = [["sheets.0.rows.4.4", 4200]]
expected = ["values_present"]

# observed in an earlier run (not a single formula, although explicitly asked for)
[[mutant]]
