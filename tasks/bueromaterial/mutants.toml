  ["sheets.0.columns.3.formula", ""],
  ["sheets.0.rows.0.3", 179.6],
  ["sheets.0.rows.1.3", 149.4],
  ["sheets.0.rows.2.3", 82.8],
  ["sheets.0.rows.3.3", 85.0],
