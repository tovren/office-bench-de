remove = ["sheets.0.rows.6", "sheets.0.rows.5", "sheets.0.rows.4", "sheets.0.rows.3", "sheets.0.rows.2",
          "sheets.0.rows.1"]
expected = ["retained", "values_present", "data_rows_min"]
