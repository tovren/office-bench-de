# observed in three earlier runs: totals per cost centre as fixed values; when a quantity changes they contradict the
# grand total (found by the change-robustness check of the blind review)
[[mutant]]
name = "cost_centre_totals_as_constants"
defect = "totals per cost centre as fixed values 311 and 413.20 instead of SUMIF"
set = [
  ["sheets.1.columns.1.formula", ""],
  ["sheets.1.rows.0.1", 311],
  ["sheets.1.rows.1.1", 413.2],
]
expected = ["formulas_min", "calculations"]
gap = "The values are right, and the task only checks the line item formula and the total row; only numbers_sourced reports 311 and 413.20 softly as „ohne Beleg“, by chance (the heuristic does not check sums of a selection). Caught by: formulas_min (reference 11 formulas, here 9) or a check that sums per group are formulas, e.g. `groups` with an option requiring the target values to be formulas; more robust: change quantities, recalculate and compare the group sums against the list (like the change-robustness check of the blind review). Deliberately left open: prompt and checklist ask for the sum per cost centre only „am besten mit SUMMEWENN“, i.e. not necessarily as a formula; a hard formulas_min = 10 would hit three real runs with correct fixed values."

# The follow-up loses content: only the changed line item is delivered with a cost centre.
[[mutant]]
name = "only_changed_item"
