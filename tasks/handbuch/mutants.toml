# Broken variants of reference.json (format: docs/mutants.md).

# observed in several earlier runs (contact table made only of placeholders)
[[mutant]]
name = "contact_placeholders"
defect = "contact table with „[Name]“ instead of names"
replace = [
  ["Selin Yilmaz, Personalabteilung", "[Name], Personalabteilung"],
  ["Jonas Brandt, IT", "[Name], IT"],
  ["Markus Keller, Fachkraft für Arbeitssicherheit", "[Name], Fachkraft für Arbeitssicherheit"],
  ["Andrea Wolf, Vorsitzende", "[Name], Vorsitzende"],
]
expected = ["placeholders"]
severity = "soft"

# observed in several earlier runs (1,330 to 1,850 words)
[[mutant]]
name = "too_short"
defect = "about 1,900 words instead of at least 2,000 (all chapters present, just shorter)"
remove = ["blocks.56", "blocks.46", "blocks.37", "blocks.14", "blocks.5", "blocks.2"]
expected = ["words_min"]

# observed in an earlier run (Cyrillic „е“ in „Patе“, U+0435)
[[mutant]]
name = "cyrillic_pate"
defect = "Cyrillic „е“ in „Patе“"
replace = [["dein Pate", "dein Patе"]]
expected = ["foreign_script"]

# Truncated output (task comment: long texts are where the JSON most likely breaks): contacts and checklist are
# missing
[[mutant]]
name = "end_missing"
