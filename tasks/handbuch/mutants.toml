# observed in several earlier runs („AU ab dem dritten Kalendertag“)
[[mutant]]
name = "sick_note_from_third_day"
defect = "medical certificate required from the third calendar day (correct: on the fourth at the latest)"
replace = [["Dauert die Arbeitsunfähigkeit länger als drei Kalendertage, brauchen wir spätestens am vierten Tag eine ärztliche Bescheinigung.",
            "Ab dem dritten Kalendertag der Arbeitsunfähigkeit brauchen wir eine ärztliche Bescheinigung."]]
expected = ["topics"]
gap = "A legal rule that no check key sees; only the blind review does. Caught by a forbidden pattern like 'ab dem (dritten|3\\.) (kalender)?tag' (or topics 'vierten|4\\. (kalender)?tag'). Deliberately left open: the checklist says „spätestens ab dem vierten Kalendertag“, and the employer may ask for the certificate earlier (§ 5 Abs. 1 Satz 3 EFZG); „ab dem dritten Tag“ as a company rule (about 25 real runs) is therefore not a sure error, and a topics pattern would also have to allow „länger als drei Tage“ or „ab dem ersten Tag“."

# observed in earlier runs („4×8,5 + 5,25 = 39,25 h statt der genannten 40 h“; Mon–Thu 9 h = 36 h instead of 40 h)
[[mutant]]
name = "weekly_hours_wrong"
defect = "working hours split wrongly: 4 × 8.5 hours + 5.25 hours = 40 hours (that makes 39.25; 39 are agreed)"
replace = [["39 Stunden pro Woche, verteilt auf Montag bis Freitag.",
            "39 Stunden pro Woche, verteilt auf Montag bis Freitag: 4 × 8,5 Stunden + 5,25 Stunden = 40 Stunden."]]
expected = ["text_arithmetic"]
severity = "soft"
