# observed in an earlier run: note „6 Stunden 40 Minuten Programm“ (9:00–16:30 = 7.5 h, 6 h without breaks)
[[mutant]]
name = "total_duration_wrong"
defect = "organisation slide: „Beginn 9:00 Uhr, Ende 16:30 Uhr, insgesamt 6 Stunden 40 Minuten“, actually 7.5 hours (6 hours without breaks and lunch)"
