# Broken variants of reference.json (format: docs/mutants.md).

# 19.11.2026 is a Thursday; the prompt names no weekday
[[mutant]]
name = "wrong_weekday"
defect = "title slide „Mittwoch, 19. November 2026“: 19.11.2026 is a Thursday"
replace = [["Donnerstag, 19. November 2026", "Mittwoch, 19. November 2026"]]
expected = ["weekday"]

# duration copied wrongly: work groups 60 instead of 75 minutes, all later times shift
[[mutant]]
name = "work_groups_60_minutes"
defect = "work groups calculated with 60 instead of 75 minutes: end 16:15 instead of 16:30, all later times wrong"
set = [["slides.2.table.7", ["13:30–14:30", "Arbeitsgruppen", "60 Min."]],
       ["slides.2.table.8", ["14:30–14:45", "Kaffeepause", "15 Min."]],
       ["slides.2.table.9", ["14:45–15:35", "Vorstellung der Ergebnisse", "50 Min."]],
       ["slides.2.table.10", ["15:35–16:15", "Maßnahmenplan und Abschluss", "40 Min."]]]
replace = [["Ende 16:30 Uhr", "Ende 16:15 Uhr"], ["Kaffeepausen 10:05 und 14:45 Uhr", "Kaffeepausen 10:05 und 14:30 Uhr"]]
expected = ["topics"]

# a single block with a wrong end time: brainstorming 11:20–12:20 (50 instead of 70 minutes), then a gap until 12:30
[[mutant]]
name = "brainstorming_end_time_wrong"
defect = "brainstorming „11:20–12:20“ with „70 Min.“: the end time matches neither the duration nor the start of lunch"
set = [["slides.2.table.5.0", "11:20–12:20"]]
expected = ["topics", "text_arithmetic"]
gap = "The topics only require that each time appears somewhere (12:30 is there at lunch); nothing checks whether in an agenda table end − start = duration and each block starts where the previous one ends (extension of text_arithmetic for time spans „hh:mm–hh:mm“ with „n Min.“ in the same row)"

