[judge]
checklist = [
  "Titelfolie mit Datum 19.11.2026; falls ein Wochentag genannt ist, Donnerstag",
  "Agenda-Tabelle mit allen zehn Blöcken in der vorgegebenen Reihenfolge und richtigen Uhrzeiten von 9:00 bis 16:30 (z. B. Rückblick 9:20–10:05, Mittagessen 12:30–13:30, Arbeitsgruppen 13:30–14:45)",
  "Ziele des Tages wie vorgegeben, Spielregeln konkret und knapp",
  "Organisatorisches: Hotel Linde in Nürtingen, Beginn 9 Uhr, Ende 16:30 Uhr, Pausen und Mittagessen; nichts Wichtiges erfunden (keine erfundene Adresse oder Telefonnummer als Fakt)",
  "5 bis 7 Folien, kurze Stichpunkte, sauberes Layout",
