# Broken variants of reference.json (format: docs/mutants.md). The task checks neither values (values_present) nor
# calculations (calculations); that is why arithmetic errors can slip through.

[[mutant]]
# observed in several earlier runs: the formula computes Pause − Ende − Beginn, −24 h per day, total −504 instead of
# 168 h
name = "formula_swapped"
defect = "working-time formula with swapped columns: start − end instead of end − start (−9 h per day, total −189 instead of 168 h)"
replace = [["=(D{row}-C{row})*24-E{row}/60", "=(C{row}-D{row})*24-E{row}/60"]]
expected = ["calculations", "values_present", "value_ranges"]

[[mutant]]
# observed in several earlier runs: times as fractions of a day, working time without time format shows 0.33 per day
# and a total of 7 instead of 168 h
name = "day_fraction_without_time_format"
defect = "working time as a fraction of a day without time format: 0.33 per day and total 7 instead of 8 or 168 hours"
replace = [["=(D{row}-C{row})*24-E{row}/60", "=D{row}-C{row}-E{row}/1440"]]
expected = ["column_format", "values_present"]
gap = "column_format only knows percent/date/euro, no hours or [h]:mm format; values_present is not set (and would have to accept 7 as an [h]:mm value). Fix: a column_format kind „hours“ (time format [h]:mm or decimal hours, i.e. values > 1 for 8-hour days) for 'arbeitszeit|stunden'"

